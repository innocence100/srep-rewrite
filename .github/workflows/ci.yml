name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare legacy test temporary root
        run: install -d -m 700 /tmp/opencode
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sh scripts/audit-lock-licenses.sh
      - run: sh scripts/test-license-audit.sh
      - run: python3 scripts/test-ci-yaml.py
      - run: sh -n scripts/regenerate-legacy-fixtures.sh
      - run: python3 -m compileall -q scripts
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --bin srep --example stage6-fixed-metrics
      - run: cargo build --bin srep --example stage7-m5-metrics
      - run: python3 scripts/compare-fixed-finders.py --decoder target/debug/srep
      - run: python3 scripts/compare-m5-finder.py --decoder target/debug/srep --metrics-binary target/debug/examples/stage7-m5-metrics
      - run: cargo test --all-targets --all-features
      - run: python3 scripts/validate-legacy-fixtures.py --acceptance --decoder target/debug/srep
      - run: cargo test --release --all-targets --all-features
      - run: cargo build --release
      - run: cargo test --doc
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
      - run: sh scripts/release-smoke.sh
      - run: python3 scripts/run-legacy-corruptions.py target/debug/srep
      - run: python3 scripts/test-legacy-tools.py

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --all-features
      - run: cargo build --release
      - run: cargo check --target x86_64-pc-windows-gnu --all-targets --all-features
      - run: cargo clippy --target x86_64-pc-windows-gnu --all-targets --all-features -- -D warnings
      - id: mingw
        shell: pwsh
        run: |
          $gcc = Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue
          $dlltool = Get-Command x86_64-w64-mingw32-dlltool -ErrorAction SilentlyContinue
          $available = ($null -ne $gcc) -and ($null -ne $dlltool)
          "available=$($available.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: steps.mingw.outputs.available == 'true'
        run: cargo test --target x86_64-pc-windows-gnu --all-targets --all-features
      - if: steps.mingw.outputs.available == 'true'
        run: cargo build --target x86_64-pc-windows-gnu --release
      - if: steps.mingw.outputs.available != 'true'
        shell: pwsh
        run: Write-Host "GNU linker unavailable; GNU check/Clippy and native Windows tests/build are the supported evidence."
